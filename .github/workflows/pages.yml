# Builds the site as a static export and publishes it to GitHub Pages on every push.
# One-time setup: repo → Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: post dates come from git

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # reproducible install when package-lock.json is committed, plain install otherwise
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Build static site
        env:
          STATIC_EXPORT: "1"
          GIT_DATES: "1"
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          # <user>.github.io repos are served from the root, everything else from /<repo>
          if [[ "$REPO" == *.github.io ]]; then export BASE_PATH=""; else export BASE_PATH="/$REPO"; fi
          echo "BASE_PATH=$BASE_PATH"
          npm run build
          touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
