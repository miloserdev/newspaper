# Validates the content, builds the site as a static export and publishes it to GitHub Pages.
#  - push to main/master  → validate → build once → deploy THAT build (an immutable artifact, nothing is re-rendered later)
#  - pull request         → validate → build a preview artifact from the exact PR commit (download it from the run); no deploy
# One-time setup: repo → Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'site' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: post dates come from git

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # reproducible install when package-lock.json is committed, plain install otherwise
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      # Broken front matter / meta.json, missing images, dead relative links… fail here (annotated on the PR), not in production.
      - name: Validate content
        run: npm run validate

      - name: Build static site
        env:
          STATIC_EXPORT: "1"
          GIT_DATES: "1"
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            export BASE_PATH="" # the preview is opened from a local static server, at the root
          elif [[ "$REPO" == *.github.io ]]; then
            export BASE_PATH="" # <user>.github.io repos are served from the root
          else
            export BASE_PATH="/$REPO"
          fi
          echo "BASE_PATH=$BASE_PATH"
          npm run build
          touch out/.nojekyll

      - name: Upload site (deploy)
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Upload preview artifact (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview-${{ github.event.pull_request.head.sha }}
          path: out
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
