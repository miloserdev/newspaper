# Checks the engine itself: types, lint, content-validator tests and a real static export of the fixture vaults.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Validator tests (fixtures/basic must be clean, fixtures/broken must fail with every expected error)
        run: npm test
      - name: Render fixture vaults (paths, nesting, links, search index)
        run: npm run test:build
      - name: Validate the demo content
        run: npm run validate
